name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, also the opencode version (e.g., v1.17.18)'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: latest

      - name: Build installer package
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效的 tag：$TAG，期望格式为 vX.Y.Z" >&2
            exit 1
          fi
          # 版本以 workflow 输入为准，覆盖 construct.yaml 中的版本号
          sed -i -E \
            -e "s/^version: \".*\"$/version: \"$VERSION\"/" \
            -e "s/^  - opencode .*$/  - opencode $VERSION/" \
            construct.yaml
          cat construct.yaml
          pixi run build

      - name: Upload package to release
        run: |
          # Try to create release if it doesn't exist, ignore error if already exists
          gh release create ${{ github.event.inputs.tag }} --generate-notes 2>/dev/null || true
          # Upload assets to the release (existing or newly created)
          gh release upload ${{ github.event.inputs.tag }} opencode* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
